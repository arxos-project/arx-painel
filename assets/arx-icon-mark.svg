<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="0.55" stop-color="#9fb0c0"/>
      <stop offset="1" stop-color="#4d5a68"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd8ff"/>
      <stop offset="1" stop-color="#1c6fb2"/>
    </linearGradient>
  </defs>

  <!-- fundo circular opcional — remover esse <g> pra usar só a marca sem selo -->
  <g id="badge-bg">
    <circle cx="200" cy="220" r="190" fill="#0b1420"/>
    <circle cx="200" cy="220" r="188" fill="none" stroke="#2a7fc9" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- ameias (crenelação) do topo da torre -->
  <g id="battlements" fill="url(#steel)">
    <rect x="140" y="55" width="16" height="35"/>
    <rect x="166" y="55" width="16" height="35"/>
    <rect x="192" y="55" width="16" height="35"/>
    <rect x="218" y="55" width="16" height="35"/>
    <rect x="244" y="55" width="16" height="35"/>
  </g>

  <!-- corpo da torre -->
  <rect id="tower-body" x="150" y="90" width="100" height="50" fill="url(#steel)"/>

  <!-- corpo do "A" com o vão (arco) interno -->
  <polygon id="a-body" fill="url(#steel)" points="
    150,140 250,140 340,380 290,380 290,320
    200,220 110,320 110,380 60,380" />

  <!-- fresta de luz vertical, atravessando torre + A -->
  <rect id="light-slit" x="193" y="100" width="14" height="125" fill="url(#glow)"/>

  <!-- estrela/farol no centro do vão -->
  <path id="spark" fill="url(#glow)"
    d="M200,245 L206,262 L223,265 L206,268 L200,285 L194,268 L177,265 L194,262 Z"/>
</svg>
